# Пример подключения готового образа бэкапа к любому стеку.
# Достаточно сослаться на образ и задать переменные — весь код внутри образа.
# Сервис должен быть в ОДНОЙ сети с БД (здесь `backend`), чтобы резолвился PGHOST.

services:
  pg-backup:
    image: xjl00/backup-postgres-s3:latest      # ← публичный образ (Docker Hub); зеркало: ghcr.io/xjl0/backup-postgres-s3
    restart: unless-stopped                    # для compose; swarm использует deploy.restart_policy
    environment:
      # БД (хост = имя сервиса БД в сети)
      PGHOST: "postgres-db"
      PGPORT: "5432"
      PGUSER: "postgres"                       # нужен CONNECT ко всем БД + чтение (проще суперюзер)
      PGPASSWORD: "CHANGE_ME"
      # S3 (rclone): подключение задаётся переменными окружения
      S3_ENDPOINT: "https://s3.kz-1.srvstorage.kz"
      S3_REGION: "kz-1"
      S3_ACCESS_KEY_ID: "CHANGE_ME"
      S3_SECRET_ACCESS_KEY: "CHANGE_ME"
      S3_BUCKET: "CHANGE_ME"
      S3_PREFIX: "myapp"
      # Поведение
      KEEP: "7"                                # полных копий (папок) каждой базы
      ZSTD_LEVEL: "3"                          # pg_dump -Z zstd:N; 3=быстро (дефолт), 9 ≈ −4% размера в 4 раза дольше
      DUMP_JOBS: "2"                           # pg_dump -j: таблиц параллельно (соединений = N+1)
      INTERVAL: "86400"                        # секунд между прогонами
      EXCLUDE_DBS: "postgres"
      # Проверки целостности
      VERIFY: "1"                              # pg_restore -l + zstd -t каждого файла перед загрузкой
      VERIFY_FULL: "1"                         # 1 = ещё и полное чтение архива (без БД), медленнее
      RESTORE_TEST: "0"                        # 1 = тест восстановления в скретч-БД (нужен CREATEDB)
    # Альтернатива environment: — файл KEY=VALUE (окружение приоритетнее файла).
    # Удобно в swarm, где stack-файл игнорирует env_file:.
    # volumes:
    #   - ./stack.env:/etc/pg-backup/env:ro
    deploy:
      placement:
        constraints:
          - node.role == manager
      replicas: 1
      restart_policy:
        condition: any
      resources:
        reservations:
          cpus: "0.2"
          memory: "128M"
        limits:
          cpus: "1.0"
          memory: "512M"
    networks:
      - backend

networks:
  backend:
    external: true
    name: backend-network     # ← имя вашей сети с БД
